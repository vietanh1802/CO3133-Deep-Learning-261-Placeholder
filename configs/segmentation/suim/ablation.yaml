name: suim_ablation_reference_seed42
model: deeplabv3
model_config:
  num_classes: 8
  pretrained: true
  freeze_batch_norm: true
  backbone: resnet50
  freeze_backbone: false
dataset: suim
seed: 42
batch_size: 4
accumulation_steps: 4
learning_rate: 0.001
backbone_learning_rate: 0.0001
weight_decay: 0.0001
epochs: 40
warmup_epochs: 5
image_height: 240
image_width: 320
evaluation_height: 240
evaluation_width: 320
augment: true
loss: cross_entropy
num_workers: 4
data_dir: data/suim
checkpoint_dir: checkpoints
results_dir: results
